<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAS async API</title>
  <style>
    body {
      margin: 0;
      padding: 0 4mm;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.6;
    }

    header {
      background-color: #000;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
    }

    nav {
      background-color: #111;
      padding: 0.5rem 2rem;
      text-align: center;
    }

    nav a {
      color: #fff;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    section {
      margin-bottom: 2rem;
    }

    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 1rem;
      position: relative;
      bottom: 0;
      width: 100%;
    }

    .button {
      background-color: #000;
      color: #fff;
      padding: 0.5rem 1rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .button:hover {
      background-color: #333;
    }

    #readme table {
      border-collapse: collapse;
      margin: 1rem 0;
    }

    #readme table th,
    #readme table td {
      border: 1px solid #ddd;
      padding: 0.4rem 0.75rem;
    }

    #readme table th {
      background-color: #f6f6f6;
    }
  </style>

</head>
<body>
<p>
  <a href="./aas-repository/" class="button">Events emitted by <b>AAS Repositories</b></a>
</p>
<p>
  <a href="./submodel-repository/" class="button">Events emitted by <b>Submodel Repositories</b></a>
</p>
<p>
  <a href="./submodel-repository-submodelelement/" class="button"><b>SubmodelElement-level</b> Events emitted by <b>Submodel Repositories</b></a>
</p>
<div id="readme">
<!-- README_CONTENT -->
</div>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false });
  // marked renders ```mermaid fences as <pre><code class="language-mermaid">…</code></pre>;
  // rewrite to the <pre class="mermaid">…</pre> shape mermaid.run() expects.
  document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
    const pre = code.parentElement;
    pre.className = 'mermaid';
    pre.textContent = code.textContent;
  });
  mermaid.run();
</script>
</body>
</html>
